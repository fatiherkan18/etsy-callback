<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'"><title>Erkan Studio · Etsy bağlantısı</title>
<style>body{font:16px/1.6 system-ui;background:#f4f4ef;color:#142b32;max-width:580px;margin:9vh auto;padding:24px}h1{font-size:32px;line-height:1.15}label{display:block;font-size:13px;margin-top:28px}textarea{box-sizing:border-box;width:100%;height:150px;border:1px solid #bed0c7;background:white;border-radius:12px;padding:12px;word-break:break-all}button{border:0;border-radius:12px;padding:16px 24px;background:#157567;color:white;font:inherit;cursor:pointer}small{color:#647274}</style>
<small>ERKAN / STUDIO</small><h1 id="title">Bağlantı bekleniyor.</h1><p>Bu adresi kopyala, Android uygulamasında ilgili mağazanın bağlantı ekranındaki yönlendirme alanına yapıştır.</p><label for="callback">Tam yönlendirme adresi</label><textarea id="callback" readonly></textarea><p><button id="copy">Adresi kopyala</button></p><small id="status">Bu sayfanın JavaScript'i adresi başka bir hizmete veya uygulamaya iletmez. HTTPS sayfasını barındıran hizmet olağan sayfa isteğini alır.</small>
<script>const field=document.getElementById('callback');field.value=location.href;const params=new URLSearchParams(location.search);document.getElementById('title').textContent=params.has('error')?'Etsy bağlantısı tamamlanmadı.':params.has('code')&&params.has('state')?'Etsy yönlendirmesi alındı.':'Bağlantı bekleniyor.';document.getElementById('copy').onclick=async()=>{field.focus();field.select();try{await navigator.clipboard.writeText(field.value);document.getElementById('status').textContent='Kopyalandı. Erkan Studio Android uygulamasına dön.'}catch{document.getElementById('status').textContent='Adresi seçtim; telefonunun Kopyala komutunu kullan.'}};</script></html>
