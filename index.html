<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Etsy OAuth Callback</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;line-height:1.5}
    .box{border:1px solid #ddd;border-radius:12px;padding:18px}
    code{word-break:break-all}
    button{padding:12px 16px;border:0;border-radius:10px;cursor:pointer}
    .ok{font-weight:700}
  </style>
</head>
<body>
  <h1>Etsy bağlantısı tamamlandı</h1>
  <div class="box">
    <p class="ok">Bu sayfayı kapatmadan önce aşağıdaki butonla tam callback adresini kopyala ve uygulamadaki callback alanına yapıştır.</p>
    <p><strong>Code:</strong> <code id="code">-</code></p>
    <p><strong>State:</strong> <code id="state">-</code></p>
    <button id="copy">Tam callback adresini kopyala</button>
    <p id="status"></p>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    document.getElementById('code').textContent = p.get('code') || '(yok)';
    document.getElementById('state').textContent = p.get('state') || '(yok)';
    document.getElementById('copy').onclick = async () => {
      await navigator.clipboard.writeText(location.href);
      document.getElementById('status').textContent = 'Kopyalandı.';
    };
  </script>
</body>
</html>
